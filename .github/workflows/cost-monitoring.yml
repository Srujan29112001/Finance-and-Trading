name: Cost Monitoring & Optimization

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track-costs:
    name: Track GitHub Actions Costs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests pandas matplotlib

    - name: Fetch billing data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<'EOF'
        import requests
        import json
        import os
        from datetime import datetime, timedelta

        token = os.environ['GITHUB_TOKEN']
        repo = os.environ['GITHUB_REPOSITORY']
        owner = repo.split('/')[0]
        headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}

        # Fetch workflow runs for the last 30 days
        url = f'https://api.github.com/repos/{repo}/actions/runs'
        params = {
            'per_page': 100,
            'created': f'>={(datetime.now() - timedelta(days=30)).isoformat()}'
        }

        all_runs = []
        page = 1
        while page <= 5:
            response = requests.get(url, headers=headers, params={**params, 'page': page})
            if response.status_code != 200:
                print(f"Warning: API request failed with status {response.status_code}")
                break
            data = response.json()
            runs = data.get('workflow_runs', [])
            if not runs:
                break
            all_runs.extend(runs)
            page += 1

        # Calculate costs
        # GitHub Actions pricing (approximate):
        # - Linux: $0.008/minute
        # - Windows: $0.016/minute
        # - macOS: $0.08/minute
        # Free tier: 2,000 minutes/month for private repos, unlimited for public

        PRICING = {
            'ubuntu-latest': 0.008,
            'windows-latest': 0.016,
            'macos-latest': 0.08,
            'ubuntu-22.04': 0.008,
            'ubuntu-20.04': 0.008,
        }

        total_minutes = 0
        total_cost = 0
        runs_by_workflow = {}
        runs_by_runner = {'ubuntu': 0, 'windows': 0, 'macos': 0}

        for run in all_runs:
            if run['run_started_at'] and run['updated_at']:
                start = datetime.fromisoformat(run['run_started_at'].replace('Z', '+00:00'))
                end = datetime.fromisoformat(run['updated_at'].replace('Z', '+00:00'))
                duration_minutes = (end - start).total_seconds() / 60

                # Estimate runner type (default to ubuntu)
                runner_type = 'ubuntu-latest'
                cost_per_minute = PRICING.get(runner_type, 0.008)
                run_cost = duration_minutes * cost_per_minute

                total_minutes += duration_minutes
                total_cost += run_cost

                # Track by workflow
                workflow_name = run['name']
                if workflow_name not in runs_by_workflow:
                    runs_by_workflow[workflow_name] = {'runs': 0, 'minutes': 0, 'cost': 0}

                runs_by_workflow[workflow_name]['runs'] += 1
                runs_by_workflow[workflow_name]['minutes'] += duration_minutes
                runs_by_workflow[workflow_name]['cost'] += run_cost

                # Track by runner type
                if 'ubuntu' in runner_type:
                    runs_by_runner['ubuntu'] += duration_minutes
                elif 'windows' in runner_type:
                    runs_by_runner['windows'] += duration_minutes
                elif 'macos' in runner_type:
                    runs_by_runner['macos'] += duration_minutes

        # Calculate savings opportunities
        free_tier_minutes = 2000  # For private repos
        billable_minutes = max(0, total_minutes - free_tier_minutes)
        actual_cost = billable_minutes * 0.008  # Average rate

        cost_data = {
            'period': {
                'start': (datetime.now() - timedelta(days=30)).isoformat(),
                'end': datetime.now().isoformat(),
                'days': 30
            },
            'total_minutes': round(total_minutes, 2),
            'estimated_cost': round(total_cost, 2),
            'billable_minutes': round(billable_minutes, 2),
            'actual_cost': round(actual_cost, 2),
            'free_tier_used': round(min(total_minutes, free_tier_minutes), 2),
            'workflows': runs_by_workflow,
            'runners': runs_by_runner,
            'avg_minutes_per_day': round(total_minutes / 30, 2),
            'projected_monthly_cost': round((total_minutes / 30) * 30 * 0.008, 2),
            'collection_time': datetime.now().isoformat()
        }

        os.makedirs('metrics', exist_ok=True)
        with open('metrics/cost-data.json', 'w') as f:
            json.dump(cost_data, f, indent=2, default=str)

        print(f"✓ Collected cost data")
        print(f"  Total Minutes: {total_minutes:.1f}")
        print(f"  Estimated Cost: ${total_cost:.2f}")
        print(f"  Billable Minutes: {billable_minutes:.1f}")
        print(f"  Actual Cost: ${actual_cost:.2f}")
        EOF

    - name: Generate cost report
      run: |
        python - <<'EOF'
        import json
        from datetime import datetime

        with open('metrics/cost-data.json', 'r') as f:
            data = json.load(f)

        report = f"""# 💰 GitHub Actions Cost Report

        **Period:** {data['period']['start'][:10]} to {data['period']['end'][:10]} ({data['period']['days']} days)
        **Generated:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}

        ## Cost Summary

        | Metric | Value |
        |--------|-------|
        | Total Minutes Used | {data['total_minutes']:.1f} min |
        | Free Tier Used | {data['free_tier_used']:.1f} min |
        | Billable Minutes | {data['billable_minutes']:.1f} min |
        | **Estimated Monthly Cost** | **${data['projected_monthly_cost']:.2f}** |
        | Avg Minutes/Day | {data['avg_minutes_per_day']:.1f} min |

        ## Cost by Workflow

        | Workflow | Runs | Minutes | Est. Cost |
        |----------|------|---------|-----------|
        """

        # Sort workflows by cost
        sorted_workflows = sorted(
            data['workflows'].items(),
            key=lambda x: x[1]['cost'],
            reverse=True
        )

        for workflow_name, stats in sorted_workflows:
            report += f"| {workflow_name} | {stats['runs']} | {stats['minutes']:.1f} | ${stats['cost']:.2f} |\n"

        report += f"""
        ## Runner Usage

        | Runner Type | Minutes | Percentage |
        |-------------|---------|------------|
        | Ubuntu (Linux) | {data['runners']['ubuntu']:.1f} | {(data['runners']['ubuntu']/data['total_minutes']*100):.1f}% |
        | Windows | {data['runners']['windows']:.1f} | {(data['runners']['windows']/data['total_minutes']*100):.1f}% |
        | macOS | {data['runners']['macos']:.1f} | {(data['runners']['macos']/data['total_minutes']*100):.1f}% |

        ## 💡 Cost Optimization Recommendations

        """

        # Generate recommendations
        recommendations = []

        if data['total_minutes'] > 3000:
            recommendations.append("- ⚠️ High usage detected - Review workflow triggers to avoid unnecessary runs")

        if data['billable_minutes'] > 0:
            savings = data['billable_minutes'] * 0.008
            recommendations.append(f"- 💰 Consider using self-hosted runners to save ${savings:.2f}/month")

        if data['runners']['macos'] > 100:
            recommendations.append("- 💸 macOS runners are 10x more expensive - Only use when necessary")

        # Check for inefficient workflows
        for workflow_name, stats in sorted_workflows[:3]:
            if stats['minutes'] / stats['runs'] > 20:
                recommendations.append(f"- 🐌 '{workflow_name}' takes {stats['minutes']/stats['runs']:.1f} min/run - Consider optimization")

        if data['avg_minutes_per_day'] < 100:
            recommendations.append("- ✅ Usage is within free tier limits")

        if not recommendations:
            recommendations.append("- ✅ Cost optimization is good - No immediate actions needed")

        for rec in recommendations:
            report += rec + "\n"

        report += f"""
        ## Projected Costs

        | Timeframe | Estimated Cost |
        |-----------|----------------|
        | Weekly | ${data['projected_monthly_cost'] / 4:.2f} |
        | Monthly | ${data['projected_monthly_cost']:.2f} |
        | Yearly | ${data['projected_monthly_cost'] * 12:.2f} |

        ## Free Tier Status

        """

        free_tier_pct = (data['free_tier_used'] / 2000) * 100
        if free_tier_pct < 50:
            report += "🟢 **Well within free tier** - " + f"{free_tier_pct:.1f}% used\n"
        elif free_tier_pct < 80:
            report += "🟡 **Moderate usage** - " + f"{free_tier_pct:.1f}% of free tier used\n"
        elif free_tier_pct < 100:
            report += "🟠 **High usage** - " + f"{free_tier_pct:.1f}% of free tier used\n"
        else:
            report += "🔴 **Exceeding free tier** - Incurring charges\n"

        report += "\n---\n*Updated daily at 00:00 UTC*\n"

        with open('metrics/cost-report.md', 'w') as f:
            f.write(report)

        print("✓ Generated cost report")
        EOF

    - name: Check for cost alerts
      id: cost_check
      run: |
        python - <<'EOF'
        import json
        import os

        with open('metrics/cost-data.json', 'r') as f:
            data = json.load(f)

        alert = False
        message = []

        # Alert if projected monthly cost > $10
        if data['projected_monthly_cost'] > 10:
            alert = True
            message.append(f"Projected monthly cost (${data['projected_monthly_cost']:.2f}) exceeds $10")

        # Alert if using > 90% of free tier
        if data['free_tier_used'] > 1800:  # 90% of 2000
            alert = True
            message.append(f"Using {(data['free_tier_used']/2000*100):.0f}% of free tier")

        # Alert if daily usage > 200 minutes
        if data['avg_minutes_per_day'] > 200:
            alert = True
            message.append(f"High daily usage: {data['avg_minutes_per_day']:.0f} minutes/day")

        if alert:
            print(f"::set-output name=alert::true")
            print(f"::set-output name=message::{'; '.join(message)}")
        else:
            print(f"::set-output name=alert::false")
            print(f"::set-output name=message::Costs are within acceptable limits")

        print(f"\nCost Status: {'ALERT' if alert else 'OK'}")
        if message:
            for msg in message:
                print(f"  - {msg}")
        EOF

    - name: Upload cost reports
      uses: actions/upload-artifact@v4
      with:
        name: cost-report-${{ github.run_number }}
        path: |
          metrics/cost-data.json
          metrics/cost-report.md
        retention-days: 90

    - name: Commit cost data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        mkdir -p .github/metrics
        cp metrics/cost-data.json .github/metrics/
        cp metrics/cost-report.md .github/metrics/

        git add .github/metrics/
        git diff --quiet && git diff --staged --quiet || \
          (git commit -m "chore: Update cost metrics [skip ci]" && git push)
      continue-on-error: true

  alert-high-costs:
    name: Alert on High Costs
    runs-on: ubuntu-latest
    needs: track-costs
    if: needs.track-costs.outputs.alert == 'true'

    steps:
    - name: Send cost alert
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            "text": "💰 GitHub Actions Cost Alert",
            "attachments": [{
              "color": "warning",
              "fields": [
                {
                  "title": "Alert",
                  "value": "${{ needs.track-costs.outputs.message }}",
                  "short": false
                },
                {
                  "title": "Repository",
                  "value": "${{ github.repository }}",
                  "short": true
                },
                {
                  "title": "View Report",
                  "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here>",
                  "short": true
                }
              ]
            }]
          }
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true
